name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-printer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        php: ['8.2', '8.5']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, zlib, phar
          coverage: none
          tools: composer:v2
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Install autoload without scripts or plugins
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts --no-plugins
      - name: Check PHP syntax
        run: |
          php -r '$roots = ["src", "tests", "examples", "bin"]; foreach ($roots as $root) { $files = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS)); foreach ($files as $file) { if ($file->isFile() && ($file->getExtension() === "php" || $file->getFilename() === "acbr-printer")) { passthru(escapeshellarg(PHP_BINARY)." -l ".escapeshellarg($file->getPathname()), $status); if ($status !== 0) exit($status); } } }'
      - name: Run validation and supported simulated-worker tests
        run: composer test
